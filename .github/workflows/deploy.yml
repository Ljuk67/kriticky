name: Deploy to WebSupport

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$PUBLIC_SUPABASE_URL" || { echo "::error::Missing PUBLIC_SUPABASE_URL"; exit 1; }
          case "$PUBLIC_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::Set PUBLIC_SUPABASE_PUBLISHABLE_KEY to the new publishable key"; exit 1 ;;
          esac
          npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: /
